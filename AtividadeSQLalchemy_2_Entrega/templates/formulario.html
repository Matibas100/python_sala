<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>{{ titulo }}</h1>

    {% if erro %}
    <p class="erro">{{ erro }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('editar', produto_id=produto_id) if produto_id else url_for('cadastrar') }}">

        <div class="form-grupo">
            <label for="nome">Nome do produto</label>
            <input type="text" id="nome" name="nome" required
                   value="{{ nome or '' }}">
        </div>

        <div class="form-grupo">
            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" name="categoria" required
                   placeholder="Notebook, Smartphone, Acessorio"
                   value="{{ categoria or '' }}">
        </div>

        <div class="form-grupo">
            <label for="preco">Preco (R$)</label>
            <input type="number" id="preco" name="preco" step="any" min="0" required
                   value="{{ preco or '' }}">
        </div>

        <div class="form-grupo">
            <label for="estoque">Estoque</label>
            <input type="number" id="estoque" name="estoque" min="0" required
                   value="{{ estoque if estoque is defined else '0' }}">
        </div>

        <button type="submit">Salvar</button>
    </form>

    <p><a href="{{ url_for('index') }}">Voltar para a lista</a></p>

</body>
</html>
