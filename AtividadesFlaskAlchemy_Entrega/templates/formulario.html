<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }}</title>
</head>
<body>
    <h1>{{ titulo }}</h1>

    <form method="POST"
          action="{{ url_for('editar', aluno_id=aluno_id) if aluno_id is defined else url_for('cadastrar') }}">
        <p>
            <label for="nome">Nome</label><br>
            <input type="text" id="nome" name="nome" required value="{{ nome or '' }}">
        </p>
        <p>
            <label for="email">E-mail</label><br>
            <input type="email" id="email" name="email" required value="{{ email or '' }}">
        </p>
        <button type="submit">Salvar</button>
    </form>

    <p><a href="{{ url_for('index') }}">Voltar</a></p>
</body>
</html>
